<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#fff6f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Задачи">
<title>Трекер полезных задач</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>:root{--ink:#2b2230;--mut:#9a8f9f;--line:#f0e8ea;--soft:#faf5f3;--gold:#f5a623;--peach:#ffd9c7;--pink:#ffc9dc;--sky:#cfe6fb;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background:linear-gradient(180deg,#fff6f1 0,#fff 260px);color:var(--ink);font-family:system-ui,-apple-system,"SF Pro Rounded","SF Pro Text",Roboto,sans-serif;font-size:16px;line-height:1.3;-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:calc(var(--sat) + 12px) 14px calc(100px + var(--sab))}
h1{font-size:30px;letter-spacing:-.8px;margin:10px 4px 14px}
.top{display:flex;align-items:center;gap:12px;padding:4px}
.top .logo{width:52px;height:52px;border-radius:16px;box-shadow:0 6px 18px rgba(240,150,120,.3)}
.top b{display:block;font-size:19px;letter-spacing:-.3px}.top span{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.dt{text-align:center}.dt b{display:block;font-size:22px;letter-spacing:-.5px}.dt span{font-size:13px;color:var(--mut)}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px rgba(80,40,60,.1);font-size:24px;line-height:1;display:grid;place-items:center;padding:0 0 3px}
.ib[disabled]{opacity:.3}
.hero{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 6px 22px rgba(120,70,80,.08);position:relative}
.hero.pf{background:linear-gradient(135deg,#fff3d6,#ffe0ec)}
.ring{width:80px;height:80px;transform:rotate(-90deg);flex:none}.ring circle{fill:none;stroke-width:8}.rt{stroke:#f3ecee}.rv{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .5s}
.rn{position:absolute;left:16px;width:80px;text-align:center}.rn b{display:block;font-size:20px}.rn span{font-size:11px;color:var(--mut)}
.ht b{display:block;font-size:17px}.ht span{font-size:14px;color:var(--mut)}
.restn{background:#eaf7ee;border-radius:16px;padding:10px 14px;margin:10px 0;font-size:14px}
.lbl{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:22px 6px 8px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:8px 12px 8px 8px;margin:8px 0;box-shadow:0 3px 14px rgba(120,70,80,.06);transition:background .25s,box-shadow .25s;position:relative}
.row.done{background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:0 3px 14px color-mix(in srgb,var(--c) 22%,transparent)}
.row.slip{background:#fbf3f3}
.ic{width:66px;height:66px;border-radius:50%;border:0;padding:0;background:none;flex:none;position:relative;transition:transform .2s}
.ic img{width:66px;height:66px;border-radius:50%;display:block;-webkit-user-drag:none;user-select:none}
.ic::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:3px solid transparent;transition:border-color .25s}
.row.done .ic::after{border-color:var(--c)}
.row.slip .ic img{filter:grayscale(.6);opacity:.7}
.ic.pop{animation:pop .4s}
.tx{flex:1;min-width:0;cursor:pointer}.tx b{display:block;font-size:16.5px;letter-spacing:-.2px}.tx span{display:block;font-size:13px;color:var(--mut);margin-top:3px}
.row.done .tx span{color:color-mix(in srgb,var(--c) 70%,#555)}
.bar{display:block;height:6px;border-radius:6px;background:#f2eaec;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.glasses{display:flex;gap:4px;margin-top:6px}.glasses i{width:14px;height:18px;border-radius:3px 3px 6px 6px;background:#eaf3fa;border:1.5px solid #cfe3f3}.glasses i.on{background:var(--c);border-color:var(--c)}
.ck{width:34px;height:34px;border-radius:50%;border:2px solid #e8dfe2;background:#fff;color:transparent;font-weight:900;font-size:17px;flex:none;display:grid;place-items:center;padding:0;transition:.2s}
.row.done .ck{background:var(--c);border-color:var(--c);color:#fff}
.row.slip .ck{color:#e36a6a;border-color:#f0c4c4}
.restb{width:100%;margin:18px 0 0;border:0;border-radius:18px;padding:14px;background:#eef8f1;font-weight:700;color:#3d7d55}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sab));max-width:640px;margin:0 auto}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut);padding:4px 10px;opacity:.75}
.tabs button i{font-style:normal;font-size:22px;filter:grayscale(1)}.tabs button.on{color:var(--ink);opacity:1}.tabs button.on i{filter:none}
.card{background:#fff;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 4px 18px rgba(120,70,80,.07)}
.wnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.wnav b{font-size:17px}
.pfrow{background:linear-gradient(135deg,#fff3d6,#ffe0ec);border-radius:14px;padding:10px 12px;margin:6px 0 10px;font-size:15px}
.srow,.wdh{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.wdh{border:0;padding:0}
.srow img{width:36px;height:36px;border-radius:50%;flex:none}.wdh>span:first-child{width:36px;flex:none}
.sn{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wd{display:flex;gap:3px}.wd i{width:13px;height:13px;border-radius:50%;background:#f1e9ec;display:block;font-style:normal}.wd i.on{background:var(--c)}.wd i.fu{background:#fff;border:1.5px dashed #e6dce0}
.wd i.h{background:none;font-size:9px;color:var(--mut);text-align:center;line-height:13px}
.srow>b,.wdh>b{width:40px;text-align:right;font-size:15px}.bst{color:var(--mut);font-size:12px;width:70px;text-align:right}
.sep{height:8px}
.sel{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px;background:#fff;margin-bottom:10px;-webkit-appearance:none;appearance:none;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal .h{font-size:11px;color:var(--mut);font-weight:700}
.cd{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;background:#faf5f6}.cd.on{background:var(--c);color:#fff}.cd.td{box-shadow:inset 0 0 0 2px var(--ink)}.cd.rs{background:#eaf7ee}
.hint{color:var(--mut);font-size:13.5px;text-align:center;margin:8px 0}
.card.big{text-align:center;padding:20px;background:linear-gradient(135deg,#fff3d6,#ffe0ec)}.fire{font-size:54px}.card.big>b{display:block;font-size:30px;letter-spacing:-.6px}.card.big>span{color:#8c7a80;font-size:14px}
.nx{margin-top:12px;font-size:14px;font-weight:600}.card.big .bar{background:#fff}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.bd{background:#fff;border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 3px 12px rgba(120,70,80,.06);opacity:.45;filter:grayscale(1)}.bd.on{opacity:1;filter:none;background:linear-gradient(160deg,#fff7e2,#ffe6ef)}
.bd i{font-style:normal;font-size:30px;display:block}.bd b{display:block;font-size:12.5px;margin-top:4px}.bd span{font-size:10.5px;color:var(--mut)}
.card.cl{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--c) 10%,#fff)}.card.cl img{width:58px;height:58px;border-radius:50%}.card.cl div{flex:1}.card.cl b{display:block;font-size:22px}.card.cl span{display:block;font-size:14px;font-weight:600}.card.cl small{color:var(--mut)}
.pill{border:0;border-radius:999px;padding:8px 12px;background:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}.fr span{font-weight:600}.fr .inp{width:140px;text-align:right}
.inp{border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-size:17px;outline:none;background:#fff;width:100%}.inp:focus{border-color:var(--ink)}.inp.big{font-size:34px;font-weight:800;text-align:center;border:0;padding:6px}
.btn{display:block;border:0;border-radius:18px;padding:14px 18px;font-size:16px;font-weight:800;background:var(--ink);color:#fff;margin-top:8px}.btn.wide{width:100%}.btn.soft{background:#f4eef0;color:var(--ink)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.bg{position:fixed;inset:0;background:rgba(40,20,30,.32);z-index:50;animation:fi .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;z-index:51;padding:10px 18px calc(18px + var(--sab));max-height:90vh;overflow:auto;animation:su .25s}
.sheet .grip{width:42px;height:5px;border-radius:5px;background:#e6dde0;margin:0 auto 10px}
.sheet h3{display:flex;align-items:center;gap:10px;font-size:21px;margin:6px 0 10px}.shi{width:44px;height:44px;border-radius:50%}
.nv{display:flex;align-items:baseline;justify-content:center;gap:6px}.nv span{color:var(--mut);font-weight:700}
input[type=range]{width:100%;accent-color:var(--c);margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px}
.wg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.gl{width:46px;height:52px;border-radius:12px 12px 16px 16px;border:2px solid #d6e9f7;background:#f3f9fd;font-size:22px;filter:grayscale(1);opacity:.45}.gl.on{filter:none;opacity:1;background:#dff1fc;border-color:#4fb8e8}
.wtot{text-align:center;font-weight:800;font-size:18px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;z-index:200;display:flex;gap:12px;align-items:center;font-weight:600;max-width:92vw;animation:su .25s}.toast button{background:none;border:0;color:#ffd34d;font-weight:800}
.conf{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}70%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes su{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.tx .glasses{display:flex}.tx .bar{display:block}

let S=Object.assign({goals:{kcal:600,steps:10000,water:2000},glass:250,first:null,start:{},remind:'21:00',seen:{}},lsGet('ht_set',{}));
let D=lsGet('ht_days',{});
if(!S.first){S.first=TODAY();saveS()}
function saveS(){lsSet('ht_set',S)}
function saveD(){lsSet('ht_days',D)}
const day=k=>D[k]||(D[k]={});
const getd=k=>D[k]||{};
const goal=t=>t.id==='kcal'?S.goals.kcal:t.id==='steps'?S.goals.steps:0;
const glasses=()=>Math.max(1,Math.round(S.goals.water/S.glass));
function liveTitle(t){if(t.id==='kcal')return'Сжечь '+nf.format(S.goals.kcal)+' калорий';if(t.id==='steps')return'Пройти '+nf.format(S.goals.steps)+' шагов';if(t.id==='water')return(S.goals.water/1000).toString().replace('.',',')+' '+(S.goals.water===1000?'литр':'литра')+' воды';return t.t}

/* English/French app (same site) auto-mark */
function efPracticed(lang,k){try{const e=JSON.parse(localStorage.getItem('efr_set')||'{}');const d=kd(k);const ek=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();return !!(e.daysL&&e.daysL[lang]&&e.daysL[lang][ek])}catch(_){return false}}

/* ===== status ===== */
function startOf(t){return S.start[t.id]||S.first}
function isDone(t,k){const d=getd(k);
 if(t.ty==='chk'){const v=d.done&&d.done[t.id];if(v===1)return true;if(v===0)return false;return(t.id==='en'||t.id==='fr')&&efPracticed(t.id,k)}
 if(t.ty==='num')return(d[t.id]||0)>=goal(t);
 if(t.ty==='water')return(d.water||0)>=glasses();
 if(t.ty==='clean')return k>=startOf(t)&&!(d.slip&&d.slip[t.id]);return false}
const isRest=k=>!!getd(k).rest;
const perfect=k=>KEY.every(t=>isDone(t,k));
function streakOf(fn,uptoK){let k=uptoK||TODAY(),n=0;if(!fn(k)&&!isRest(k))k=addD(k,-1);for(let i=0;i<2000;i++){if(k<S.first&&!fn(k))break;if(isRest(k)){k=addD(k,-1);continue}if(fn(k)){n++;k=addD(k,-1)}else break}return n}
function bestOf(fn){let best=0,cur=0;for(let k=S.first;k<=TODAY();k=addD(k,1)){if(isRest(k))continue;if(fn(k)){cur++;if(cur>best)best=cur}else if(k!==TODAY())cur=0}return best}
function cleanStats(t){const st=startOf(t),today=TODAY();let cur=0,best=0,total=0,run=0;for(let k=st;k<=today;k=addD(k,1)){if(isDone(t,k)){run++;total++;if(run>best)best=run}else run=0}cur=run;return{cur,best,total}}

function sheet(html){closeSheet();const bg=document.createElement('div');bg.className='bg';const el=document.createElement('div');el.className='sheet';el.innerHTML='<div class="grip"></div>'+html;document.body.append(bg,el);bg.onclick=closeSheet;SHEET={bg,el};return el}
let TT=null;function toast(m,lbl,fn){TT&&TT.remove();const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(m)}</span>${lbl?`<button>${esc(lbl)}</button>`:''}`;document.body.appendChild(t);TT=t;if(lbl)t.querySelector('button').onclick=()=>{t.remove();fn&&fn()};setTimeout(()=>{if(TT===t){t.remove();TT=null}},lbl?5000:2600)}
const APP=$('#app');let VIEW='day',CUR=TODAY(),WK=0,CALM=null,CALT='chain';

/* ===== day view ===== */
function fmtDay(k){const d=kd(k);return WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]}
function rowHTML(t,k){const done=isDone(t,k),d=getd(k);let sub='',bar='';
 if(t.ty==='num'){const v=d[t.id]||0,g=goal(t);sub=`${nf.format(v)} / ${nf.format(g)} ${t.unit}`;bar=`<span class="bar"><i style="width:${Math.min(100,v/g*100)}%;background:${t.c}"></i></span>`}
 else if(t.ty==='water'){const v=d.water||0,g=glasses();sub=`${v} из ${g} стаканов · ${nf.format(v*S.glass)} мл`;bar=`<span class="glasses">${Array.from({length:g},(_,i)=>`<i class="${i<v?'on':''}"></i>`).join('')}</span>`}
 else if(t.ty==='clean'){const cs=cleanStats(t);sub=k<startOf(t)?'ещё не начала считать':done?`${cs.cur} ${plural(cs.cur,'день','дня','дней')} без срыва · рекорд ${cs.best}`:'сегодня был срыв · ничего, начнём заново'}
 else{const s=streakOf(x=>isDone(t,x));sub=s>1?`🔥 ${s} ${plural(s,'день','дня','дней')} подряд`:(t.id==='en'||t.id==='fr')&&d.done&&d.done[t.id]==null&&done?'отмечено из «English / French»':''}
 if(!sub&&t.sub)sub=t.sub;
 const fl=t.ty!=='clean'&&t.ty!=='chk'?streakOf(x=>isDone(t,x)):0;
 return `<div class="row${done?' done':''}${t.ty==='clean'&&!done&&k>=startOf(t)?' slip':''}" style="--c:${t.c}" data-id="${t.id}">
 <button class="ic" data-act="tap" data-id="${t.id}"><img src="${ICONS[t.i]}" alt=""></button>
 <div class="tx" data-act="${t.ty==='chk'?'tap':'edit'}" data-id="${t.id}"><b>${esc(liveTitle(t))}</b>${sub?`<span>${sub}${fl>1?` · 🔥 ${fl}`:''}</span>`:''}${bar}</div>
 <button class="ck" data-act="${t.ty==='chk'||t.ty==='clean'?'tap':'edit'}" data-id="${t.id}">${t.ty==='clean'&&!done&&k>=startOf(t)?'✕':'✓'}</button></div>`}
function viewDay(){const k=CUR,today=TODAY();const kd7=KEY.filter(t=>isDone(t,k)).length,all=T.filter(t=>isDone(t,k)).length;const chain=streakOf(perfect);const pf=perfect(k);
 const R=34,C=2*Math.PI*R,frac=kd7/KEY.length;
 return `<div class="wrap" id="dayw"><div class="top"><img class="logo" src="${LOGO}" alt=""><div><b>Трекер полезных задач</b><span>${chain?`🔥 Цепочка: ${chain} ${plural(chain,'день','дня','дней')}`:'Выполни 7 важных задач, чтобы начать цепочку'}</span></div></div>
 <div class="dnav"><button class="ib" data-act="prev">‹</button><div class="dt"><b>${k===today?'Сегодня':k===addD(today,-1)?'Вчера':fmtDay(k)}</b><span>${k===today||k===addD(today,-1)?fmtDay(k):''}</span></div><button class="ib" data-act="next"${k>=today?' disabled':''}>›</button></div>
 <div class="hero${pf?' pf':''}"><svg viewBox="0 0 80 80" class="ring"><circle cx="40" cy="40" r="${R}" class="rt"/><circle cx="40" cy="40" r="${R}" class="rv" style="stroke-dasharray:${C};stroke-dashoffset:${C*(1-frac)}"/></svg><div class="rn"><b>${kd7}/${KEY.length}</b><span>важных</span></div>
 <div class="ht"><b>${pf?'Идеальный день! 🎉':isRest(k)?'День отдыха 🌴':kd7===KEY.length-1?'Осталась одна важная задача!':'Важные задачи'}</b><span>Всего выполнено ${all} из ${T.length}</span>${k!==today&&k<S.first?'':''}</div></div>
 ${isRest(k)?`<div class="restn">🌴 Сегодня день отдыха или перелёт: цепочки не прервутся.</div>`:''}
 <div class="lbl">⭐ Важные · цепочка</div>${KEY.map(t=>rowHTML(t,k)).join('')}
 <div class="lbl">Остальные</div>${T.filter(t=>!t.key&&t.ty!=='clean').map(t=>rowHTML(t,k)).join('')}
 <div class="lbl">Без вредного</div>${T.filter(t=>t.ty==='clean').map(t=>rowHTML(t,k)).join('')}
 <button class="restb" data-act="rest">${isRest(k)?'Отменить день отдыха':'🌴 День отдыха / перелёт'}</button></div>`}

/* ===== stats view ===== */
function weekKeys(off){const d=new Date();const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow+off*7);const k0=dk(d);return Array.from({length:7},(_,i)=>addD(k0,i))}
function viewStats(){const ks=weekKeys(WK),today=TODAY(),past=ks.filter(k=>k<=today);const pfN=past.filter(perfect).length;
 const d0=kd(ks[0]),d6=kd(ks[6]);const lab=WK===0?'Эта неделя':WK===-1?'Прошлая неделя':`${d0.getDate()} ${MON[d0.getMonth()].slice(0,3)} – ${d6.getDate()} ${MON[d6.getMonth()].slice(0,3)}`;
 const row=t=>{const n=past.filter(k=>isDone(t,k)).length;return `<div class="srow" data-act="calt" data-id="${t.id}"><img src="${ICONS[t.i]}" alt=""><span class="sn">${esc(liveTitle(t))}</span><span class="wd">${ks.map(k=>`<i class="${k>today?'fu':isDone(t,k)?'on':''}" style="--c:${t.c}"></i>`).join('')}</span><b style="color:${n?t.c:'#b9b4bf'}">${n}/${past.length||7}</b></div>`};
 if(!CALM){const d=new Date();CALM={y:d.getFullYear(),m:d.getMonth()}}
 const fn=CALT==='chain'?perfect:(k=>isDone(TM[CALT],k));const col=CALT==='chain'?'#f5a623':TM[CALT].c;
 const first=new Date(CALM.y,CALM.m,1),off=(first.getDay()+6)%7,dim=new Date(CALM.y,CALM.m+1,0).getDate();let cells='',cnt=0;for(let i=0;i<off;i++)cells+='<span></span>';
 for(let d=1;d<=dim;d++){const k=CALM.y+'-'+p2(CALM.m+1)+'-'+p2(d);const on=k<=today&&fn(k);if(on)cnt++;cells+=`<span class="cd${on?' on':''}${k===today?' td':''}${isRest(k)?' rs':''}" style="--c:${col}">${d}</span>`}
 return `<div class="wrap"><h1>Статистика</h1>
 <div class="card"><div class="wnav"><button class="ib" data-act="wprev">‹</button><b>${lab}</b><button class="ib" data-act="wnext"${WK>=0?' disabled':''}>›</button></div>
 <div class="pfrow">🔥 Идеальных дней: <b>${pfN} из ${past.length||7}</b></div>
 <div class="wdh"><span></span><span class="sn"></span><span class="wd">${WDS.map(x=>`<i class="h">${x}</i>`).join('')}</span><b></b></div>
 ${KEY.map(row).join('')}<div class="sep"></div>${T.filter(t=>!t.key).map(row).join('')}</div>
 <div class="lbl">Календарь месяца</div><div class="card"><select class="sel" id="calsel"><option value="chain"${CALT==='chain'?' selected':''}>🔥 Идеальные дни (цепочка)</option>${T.map(t=>`<option value="${t.id}"${CALT===t.id?' selected':''}>${esc(liveTitle(t))}</option>`).join('')}</select>
 <div class="wnav"><button class="ib" data-act="mprev">‹</button><b>${MONF[CALM.m]} ${CALM.y}</b><button class="ib" data-act="mnext">›</button></div>
 <div class="cal">${WDS.map(x=>`<span class="h">${x}</span>`).join('')}${cells}</div><div class="hint">Отмечено дней: ${cnt}</div></div></div>`}

/* ===== rewards ===== */
const LV=[[3,'🌱','3 дня'],[7,'⭐','Неделя'],[14,'💪','2 недели'],[30,'🏅','Месяц'],[50,'💎','50 дней'],[100,'👑','100 дней'],[200,'🚀','200 дней'],[365,'🏆','Год']];
function viewRewards(){const best=bestOf(perfect),cur=streakOf(perfect);const next=LV.find(l=>l[0]>best);
 const cl=T.filter(t=>t.ty==='clean').map(t=>({t,s:cleanStats(t)}));
 const tb=T.filter(t=>t.ty!=='clean').map(t=>({t,cur:streakOf(k=>isDone(t,k)),best:bestOf(k=>isDone(t,k))})).sort((a,b)=>b.cur-a.cur);
 return `<div class="wrap"><h1>Награды</h1>
 <div class="card big"><div class="fire">🔥</div><b>${cur} ${plural(cur,'день','дня','дней')}</b><span>цепочка идеальных дней · рекорд ${best}</span>${next?`<div class="nx">До награды «${next[2]}» ${next[0]-Math.max(cur,0)>0?'осталось '+(next[0]-cur)+' '+plural(next[0]-cur,'день','дня','дней'):''}</div><span class="bar"><i style="width:${Math.min(100,cur/next[0]*100)}%;background:#f5a623"></i></span>`:''}</div>
 <div class="badges">${LV.map(l=>`<div class="bd${best>=l[0]?' on':''}"><i>${l[1]}</i><b>${l[2]}</b><span>${best>=l[0]?'получено':'цепочка '+l[0]}</span></div>`).join('')}</div>
 <div class="lbl">Без вредного</div>${cl.map(({t,s})=>`<div class="card cl" style="--c:${t.c}"><img src="${ICONS[t.i]}" alt=""><div><b>${s.cur} ${plural(s.cur,'день','дня','дней')}</b><span>${esc(t.t)}</span><small>рекорд ${s.best} · всего чистых дней ${s.total}</small></div><button class="pill" data-act="start" data-id="${t.id}">С какого дня</button></div>`).join('')}
 <div class="lbl">Серии по задачам</div><div class="card">${tb.map(x=>`<div class="srow"><img src="${ICONS[x.t.i]}" alt=""><span class="sn">${esc(liveTitle(x.t))}</span><b style="color:${x.cur?x.t.c:'#b9b4bf'}">🔥 ${x.cur}</b><small class="bst">рекорд ${x.best}</small></div>`).join('')}</div></div>`}

 <label class="fr"><span>Калории за день</span><input class="inp" type="number" inputmode="numeric" id="gk" value="${S.goals.kcal}"></label>

/* ===== render ===== */
function render(){closeSheet();let h=VIEW==='day'?viewDay():VIEW==='stats'?viewStats():VIEW==='rew'?viewRewards():viewSet();
 APP.innerHTML=h+`<nav class="tabs">${[['day','✅','День'],['stats','📊','Статистика'],['rew','🏆','Награды'],['set','⚙️','Настройки']].map(([k,i,t])=>`<button class="${VIEW===k?'on':''}" data-act="tab" data-v="${k}"><i>${i}</i><span>${t}</span></button>`).join('')}</nav>`;

/* ===== actions ===== */
function confetti(){const box=document.createElement('div');box.className='conf';const cols=['#f5a623','#f27aa8','#5aa9e6','#6cc28a','#b77ad6','#ffd34d'];
 for(let i=0;i<70;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];p.style.animationDelay=Math.random()*.4+'s';p.style.animationDuration=1.6+Math.random()*1.2+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(p)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3200)}
function bump(id){const r=document.querySelector(`.row[data-id="${id}"] .ic`);if(r){r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop')}}
function after(prevPf,id){saveD();render();bump(id);const k=CUR;if(!prevPf&&perfect(k)){confetti();const c=streakOf(perfect);toast(`Идеальный день! Цепочка: ${c} ${plural(c,'день','дня','дней')} 🔥`);const l=LV.find(l=>l[0]===c);if(l&&k===TODAY())setTimeout(()=>toast(`Новая награда: ${l[1]} ${l[2]}!`),2700)}}
function tap(t){const k=CUR;if(k>TODAY())return;const pf=perfect(k);const d=day(k);
 if(t.ty==='chk'){d.done=d.done||{};d.done[t.id]=isDone(t,k)?0:1;if(navigator.vibrate)navigator.vibrate(10);after(pf,t.id)}
 else if(t.ty==='water'){d.water=(d.water||0)+1;if(d.water>glasses()+6)d.water=glasses()+6;after(pf,t.id);if(d.water===glasses())toast('2 литра есть! 💧')}
 else if(t.ty==='num')numSheet(t);
 else if(t.ty==='clean'){if(k<startOf(t)){toast('Счёт начинается с '+fmtDay(startOf(t)).toLowerCase());return}d.slip=d.slip||{};
  if(d.slip[t.id]){delete d.slip[t.id];after(pf,t.id);toast('Срыв отменён')}else{const el=sheet(`<h3>${esc(t.t)}</h3><p class="hint" style="text-align:left">Отметить, что ${k===TODAY()?'сегодня':'в этот день'} был срыв? Счётчик начнётся заново, рекорд сохранится.</p><div class="row2"><button class="btn soft" id="no">Нет, всё чисто</button><button class="btn" id="yes" style="background:${t.c}">Был срыв</button></div>`);
   el.querySelector('#no').onclick=closeSheet;el.querySelector('#yes').onclick=()=>{d.slip[t.id]=1;closeSheet();after(pf,t.id);toast('Ничего страшного. Завтра новый день 💛')}}}}
function numSheet(t){const k=CUR,d=day(k);const pf=perfect(k);let v=d[t.id]||0;const g=goal(t);
 const el=sheet(`<h3><img src="${ICONS[t.i]}" class="shi" alt="">${esc(liveTitle(t))}</h3><div class="nv"><input class="inp big" id="nv" type="number" inputmode="numeric" value="${v||''}" placeholder="0"><span>${t.unit}</span></div>
 <input type="range" id="nr" min="0" max="${Math.round(g*2)}" step="${t.id==='kcal'?10:100}" value="${v}" style="--c:${t.c}">
 <div class="chips">${t.quick.map(q=>`<button class="chip" data-q="${q}">+${nf.format(q)}</button>`).join('')}<button class="chip" data-q="goal">Цель ${nf.format(g)}</button><button class="chip" data-q="0">Сбросить</button></div>
 <div class="hint" id="nh"></div><button class="btn wide" id="ns" style="background:${t.c}">Сохранить</button>`);
 const inp=el.querySelector('#nv'),rg=el.querySelector('#nr'),nh=el.querySelector('#nh');const upd=()=>{nh.textContent=v>=g?'Цель достигнута 🎉':`До цели: ${nf.format(g-v)} ${t.unit}`;rg.value=v};upd();
 inp.oninput=()=>{v=Math.max(0,parseInt(inp.value)||0);upd()};rg.oninput=()=>{v=+rg.value;inp.value=v;upd()};
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q;v=q==='goal'?Math.max(v,g):q==='0'?0:v+ +q;inp.value=v||'';upd()});
 el.querySelector('#ns').onclick=()=>{d[t.id]=v;closeSheet();after(pf,t.id)}}
function waterSheet(t){const k=CUR,d=day(k),pf=perfect(k);let v=d.water||0;const g=glasses();
 const draw=()=>{el.querySelector('#wg').innerHTML=Array.from({length:Math.max(g,v)+1},(_,i)=>`<button class="gl${i<v?' on':''}" data-i="${i}">💧</button>`).join('');el.querySelector('#wt').textContent=`${v} из ${g} · ${nf.format(v*S.glass)} мл`;el.querySelectorAll('.gl').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;v=i<v?i:i+1;draw()})};
 const el=sheet(`<h3><img src="${ICONS[t.i]}" class="shi" alt="">Вода</h3><div class="hint">Нажми на стакан, сколько выпила. Один стакан ${S.glass} мл</div><div class="wg" id="wg"></div><div class="wtot" id="wt"></div><div class="row2"><button class="btn soft" id="wm">− стакан</button><button class="btn" id="wp" style="background:${t.c}">+ стакан</button></div><button class="btn wide" id="ws" style="margin-top:10px">Готово</button>`);
 draw();el.querySelector('#wm').onclick=()=>{v=Math.max(0,v-1);draw()};el.querySelector('#wp').onclick=()=>{v++;draw()};el.querySelector('#ws').onclick=()=>{d.water=v;closeSheet();after(pf,t.id)}}
function startSheet(t){const el=sheet(`<h3>${esc(t.t)}</h3><div class="hint" style="text-align:left">С какого дня считать? Если ты уже держишься какое-то время, поставь дату начала.</div><input class="inp" type="date" id="sd" value="${startOf(t)}" max="${TODAY()}"><button class="btn wide" id="ss" style="margin-top:12px;background:${t.c}">Сохранить</button>`);
 el.querySelector('#ss').onclick=()=>{const v=el.querySelector('#sd').value;if(!v)return;S.start[t.id]=v;if(v<S.first)S.first=v;saveS();closeSheet();render()}}
function ics(){const [hh,mm]=(S.remind||'21:00').split(':').map(Number);const d=new Date();d.setHours(hh,mm,0,0);if(d<new Date())d.setDate(d.getDate()+1);
 const f=x=>x.getUTCFullYear()+p2(x.getUTCMonth()+1)+p2(x.getUTCDate())+'T'+p2(x.getUTCHours())+p2(x.getUTCMinutes())+'00Z';const e=new Date(d.getTime()+10*6e4);
 const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tracker//RU','BEGIN:VEVENT','UID:tracker-remind@zadachi','DTSTAMP:'+f(new Date()),'DTSTART:'+f(d),'DTEND:'+f(e),'RRULE:FREQ=DAILY','SUMMARY:Отметь задачи в трекере ✅','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Отметь задачи в трекере','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
 shareFile(new File([txt],'napominanie.ics',{type:'text/calendar'}))}
async function shareFile(f){if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return true}catch(e){return false}}const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}
function exportData(){const d=new Date();shareFile(new File([JSON.stringify({app:'tracker-zadach',v:1,exported:Date.now(),S,D})],`treker-kopiya-${dk(d)}.json`,{type:'application/json'})).then(ok=>{if(ok)toast('Копия готова')})}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='tracker-zadach')throw 0;if(!confirm('Заменить все отметки данными из копии?'))return;S=Object.assign(S,j.S);D=j.D||{};saveS();saveD();toast('Восстановлено');render()}catch(e){toast('Это не файл копии трекера')}};i.click()}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,t=TM[a.dataset.id];
 switch(act){
  case'tab':VIEW=a.dataset.v;if(VIEW==='day')CUR=TODAY();render();window.scrollTo(0,0);break;
  case'tap':if(t)tap(t);break;
  case'edit':if(t){if(t.ty==='water')waterSheet(t);else if(t.ty==='num')numSheet(t);else tap(t)}break;
  case'prev':CUR=addD(CUR,-1);render();break;
  case'next':if(CUR<TODAY()){CUR=addD(CUR,1);render()}break;
  case'rest':{const d=day(CUR);d.rest=d.rest?0:1;saveD();render();toast(d.rest?'День отдыха: цепочки на паузе 🌴':'День отдыха отменён');break}
  case'wprev':WK--;render();break;case'wnext':if(WK<0){WK++;render()}break;
  case'mprev':CALM.m--;if(CALM.m<0){CALM.m=11;CALM.y--}render();break;case'mnext':CALM.m++;if(CALM.m>11){CALM.m=0;CALM.y++}render();break;
  case'calt':CALT=a.dataset.id;render();setTimeout(()=>{const c=$('#calsel');c&&c.scrollIntoView({behavior:'smooth',block:'center'})},50);break;
  case'start':if(t)startSheet(t);break;
  case'savegoals':{const g=id=>Math.max(1,parseInt($('#'+id).value)||0);S.goals.kcal=g('gk');S.goals.steps=g('gs');S.goals.water=g('gw');S.glass=g('gg');saveS();toast('Цели сохранены');render();break}
  case'ics':S.remind=$('#rt').value||'21:00';saveS();ics();break;
  case'export':exportData();break;case'import':importData();break;
 }});
let SW=null;document.addEventListener('touchstart',e=>{SW=VIEW==='day'&&!SHEET&&e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!SW)return;const t=e.changedTouches[0],dx=t.clientX-SW.x,dy=t.clientY-SW.y;SW=null;if(Math.abs(dx)>80&&Math.abs(dx)>2*Math.abs(dy)){if(dx>0){CUR=addD(CUR,-1);render()}else if(CUR<TODAY()){CUR=addD(CUR,1);render()}}},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&VIEW==='day'&&CUR!==TODAY()&&!SHEET){}if(!document.hidden&&!SHEET)render()});
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
